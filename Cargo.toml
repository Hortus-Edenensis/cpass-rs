[package]
name = "cpass"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0"
description = "Chaoxing course tasks and conservative question resolution"
repository = "https://github.com/Hortus-Edenensis/cpass-rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "multipart", "rustls-tls", "gzip"] }
scraper = "0.24"
regex = "1"
html-escape = "0.2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
md5 = "0.8"
rand = "0.9"
qrcode = { version = "0.14", default-features = false }

reqwest_cookie_store = "0.9"
cookie_store = "0.22"
serde_json_path = "0.7"

[profile.release]
strip = true
lto = "thin"
