[workspace]
members = ["crates/cpass-core", "crates/cpass-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/Hortus-Edenensis/cpass-rs"
authors = ["Hortus Edenensis"]

[workspace.dependencies]
aes = "0.8.4"
async-trait = "0.1.89"
base64 = "0.22.1"
cbc = "0.1.2"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
reqwest = { version = "0.12.24", default-features = false, features = ["cookies", "json", "rustls-tls"] }
qrcode = "0.14.1"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
url = "2.5.7"
webpki-roots = "1.0.6"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
