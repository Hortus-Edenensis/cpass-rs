<html>
  <head>
    <title>章节测验</title>
  </head>
  <body>
    <h3 class="py-Title">绪论测验</h3>
    <form id="form1">
      <input id="workAnswerId" value="99001" />
      <input id="totalQuestionNum" value="3" />
      <input id="workRelationId" value="88001" />
      <input id="fullScore" value="100" />
      <input id="enc_work" value="enc-work-submit-001" />
    </form>

    <div class="Py-mian1">
      <div class="Py-m1-title">
        <span>1.</span>
        <span>单选题</span>
        <p>普通话以哪种方言为基础方言？</p>
      </div>
      <input id="answertype700101" value="0" />
      <input class="answerInput" value="B" />
      <ul>
        <li class="more-choose-item">
          <em class="choose-opt" id-param="A">A</em>
          <div class="choose-desc">A. 吴方言</div>
        </li>
        <li class="more-choose-item">
          <em class="choose-opt" id-param="B">B</em>
          <div class="choose-desc">B. 北方方言</div>
        </li>
        <li class="more-choose-item">
          <em class="choose-opt" id-param="C">C</em>
          <div class="choose-desc">C. 粤方言</div>
        </li>
        <li class="more-choose-item">
          <em class="choose-opt" id-param="D">D</em>
          <div class="choose-desc">D. 闽方言</div>
        </li>
      </ul>
    </div>

    <div class="Py-mian1">
      <div class="Py-m1-title">
        <span>2.</span>
        <span>填空题</span>
        <p>请补全“词汇”相关术语。</p>
      </div>
      <input id="answertype700102" value="2" />
      <ul class="blankList2">
        <li>
          <span>词义：</span>
          <input class="blankInp2" value="" />
        </li>
        <li>
          <span>词性：</span>
          <input class="blankInp2" value="" />
        </li>
      </ul>
    </div>

    <div class="Py-mian1">
      <div class="Py-m1-title">
        <span>3.</span>
        <span>判断题</span>
        <p>现代汉语共同语就是普通话。</p>
      </div>
      <input id="answertype700103" value="3" />
      <input class="answerInput" value="true" />
    </div>
  </body>
</html>
