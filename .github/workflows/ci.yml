name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked Python dependencies
        run: |
          python -m pip install poetry==1.8.5
          poetry install --only main --no-root --no-interaction

      - name: Offline Python regression tests
        env:
          CPASS_TEST_FULL_STARTUP: "1"
        run: poetry run python -m unittest discover -s tests -v

      - name: Python startup and OCR smoke test
        run: poetry run python main.py --self-check

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build
        run: cargo build --locked --workspace --release

  docker-smoke:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cpass-rs:ci .

      - name: Smoke test
        run: docker run --rm cpass-rs:ci --help
