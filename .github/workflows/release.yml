name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cpass-linux-x86_64
            binary_name: cpass
          - os: macos-latest
            artifact_name: cpass-macos-x86_64
            binary_name: cpass
          - os: windows-latest
            artifact_name: cpass-windows-x86_64
            binary_name: cpass.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          cp target/release/cpass out/${{ matrix.binary_name }}
          shasum -a 256 out/${{ matrix.binary_name }} > out/${{ matrix.binary_name }}.sha256

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target/release/cpass.exe out/${{ matrix.binary_name }}
          $hash = Get-FileHash out/${{ matrix.binary_name }} -Algorithm SHA256
          "$($hash.Hash.ToLower())  ${{ matrix.binary_name }}" | Set-Content out/${{ matrix.binary_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out/

  docker:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hortusedenensis/cpass-rs
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
