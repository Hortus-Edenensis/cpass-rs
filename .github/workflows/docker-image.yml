name: Rust container

on:
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Login to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: ${{ github.event_name == 'release' }}
          load: true
          tags: ghcr.io/hortus-edenensis/cpass-rs:latest
          file: Dockerfile
          context: .
      - name: Container and native OCR smoke
        run: |
          docker run --rm --network none ghcr.io/hortus-edenensis/cpass-rs:latest --help
          docker run --rm --network none ghcr.io/hortus-edenensis/cpass-rs:latest config-check
          docker run --rm --network none -v "$PWD/tests/fixtures:/fixtures:ro" ghcr.io/hortus-edenensis/cpass-rs:latest ocr --image /fixtures/ocr_hint.png > ocr.json
          python3 -c 'import json; data=json.load(open("ocr.json")); assert data["requires_confirmation"] is True; assert "CPASS" in data["text"]'
