name: Rust checks and packages
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: '1.88.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - run: rustup default ${{ matrix.toolchain }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Release CLI smoke
        run: |
          cargo run --locked --release -- --help
          cargo run --locked --release -- config-check
          cargo run --locked --release -- parse --kind work --input tests/fixtures/work_questions.html
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          cp target/release/cpass config.yml README.md ROADMAP.md LICENSE out/
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item target/release/cpass.exe,config.yml,README.md,ROADMAP.md,LICENSE out/
      - uses: actions/upload-artifact@v4
        with:
          name: cpass-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}
          path: out/
